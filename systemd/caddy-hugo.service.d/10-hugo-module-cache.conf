[Service]
# systemd system services do not receive a login HOME by default. Without it,
# Hugo falls back to /tmp/hugo_cache, which is not a durable module cache.
Environment="HOME=/root"
Environment="HUGO_CACHEDIR=/root/.cache/hugo_cache"

# Prefer a mainland China Go module mirror. `direct` remains a fallback for
# modules that have not yet been mirrored.
Environment="GOPROXY=https://goproxy.cn,direct"
